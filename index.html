<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC IBAN & Kartvizit Sistemi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-[#e8f3ff] min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Arka Plan Tasarımı -->
    <div class="fixed inset-x-0 top-0 h-72 bg-[#0755a5] -z-10"></div>
    <div class="fixed -left-24 top-28 h-64 w-64 rounded-full bg-[#1cc6b6]/30 blur-3xl -z-10"></div>
    <div class="fixed -right-24 top-4 h-72 w-72 rounded-full bg-[#67a9ff]/35 blur-3xl -z-10"></div>

    <!-- Yükleniyor Ekranı -->
    <div id="loading" class="text-white font-semibold text-sm">Yükleniyor...</div>

    <!-- ========================================== -->
    <!-- 1. EKRAN: BİLGİSAYAR BAŞI YÖNETİM PANELİ  -->
    <!-- ========================================== -->
    <div id="admin-panel" class="hidden w-full max-w-md bg-white shadow-2xl rounded-xl overflow-hidden border border-white/70">
        <div class="h-2 bg-[#1cc6b6]"></div>
        <div class="p-6 sm:p-8">
            <div class="border-b pb-4 mb-5">
                <h2 class="text-xl font-bold text-[#10233d]">NFC Kart Yönetim Paneli</h2>
                <p class="text-xs text-slate-500 mt-1">Saha ekibinden gelen bilgileri girip link üretin</p>
            </div>

            <form onsubmit="saveCustomer(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Ad Soyad / İşletme Adı *</label>
                    <input type="text" id="inp-name" required placeholder="Örn: Osman ÇİÇEK" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#0755a5]">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Banka Adı *</label>
                    <input type="text" id="inp-bank" required placeholder="Örn: Akbank" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#0755a5]">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">IBAN Numarası *</label>
                    <input type="text" id="inp-iban" required placeholder="TR10 0004 6006 9388 8000 1507 74" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm font-mono focus:outline-none focus:border-[#0755a5]">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Telefon Numarası (İsteğe Bağlı)</label>
                    <input type="text" id="inp-phone" placeholder="Örn: 0542 580 82 11" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#0755a5]">
                </div>

                <button type="submit" id="save-btn" class="w-full bg-[#0755a5] hover:bg-[#063d78] text-white font-semibold py-3 rounded-lg transition mt-2">
                    Kaydet ve Link Üret
                </button>
            </form>

            <!-- Üretilen Link Kutusu -->
            <div id="result-box" class="hidden mt-6 p-4 bg-emerald-50 border border-emerald-200 rounded-xl">
                <p class="text-xs font-bold text-emerald-800 uppercase mb-2">Link Hazır! WhatsApp'tan Ekibe Gönder:</p>
                <input type="text" id="generated-url" readonly class="w-full bg-white border border-emerald-300 rounded p-2 text-xs text-slate-700 mb-3 font-mono">
                <div class="flex gap-2">
                    <button onclick="copyGeneratedUrl()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2.5 rounded-lg transition">
                        <i class="fa-regular fa-copy mr-1"></i> Linki Kopyala
                    </button>
                    <a id="preview-link" href="#" target="_blank" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold py-2.5 rounded-lg transition text-center">
                        Kartı Aç
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. EKRAN: MÜŞTERİ İBAN & KARTVİZİT EKRANI  -->
    <!-- ========================================== -->
    <section id="card-view" class="hidden relative w-full max-w-md overflow-hidden border border-white/70 bg-white shadow-[0_24px_70px_rgba(12,63,126,0.22)] rounded-xl">
        <div class="h-2 bg-[#1cc6b6]"></div>
        <div class="px-5 pb-6 pt-8 sm:px-8 sm:pb-8 sm:pt-10">
            
            <header class="text-center">
                <div class="mx-auto flex h-24 w-24 items-center justify-center overflow-hidden rounded-full border-4 border-white bg-[#e8f3ff] shadow-lg ring-1 ring-[#0755a5]/15">
                    <span id="card-initials" class="text-3xl font-bold text-[#0755a5]"></span>
                </div>
                <p class="mt-5 text-xs font-semibold uppercase tracking-[0.18em] text-[#087a73]">DİJİTAL İBAN & KARTVİZİT</p>
                <h1 id="card-name" class="mt-2 text-2xl sm:text-3xl font-semibold text-[#10233d]"></h1>
                <div class="mx-auto mt-4 h-px w-12 bg-[#1cc6b6]"></div>
            </header>

            <div class="mt-8 divide-y divide-[#dbe8f5] border-y border-[#dbe8f5]">
                <!-- Telefon Satırı -->
                <a id="row-phone" class="hidden group flex items-center gap-4 py-4" href="#">
                    <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-[#e8f3ff] text-[#0755a5]">
                        <i class="fa-solid fa-phone"></i>
                    </span>
                    <span class="min-w-0 text-left">
                        <span class="block text-xs font-medium uppercase tracking-[0.14em] text-[#68809d]">Telefon</span>
                        <span id="val-phone" class="mt-1 block text-base font-medium text-[#10233d]"></span>
                    </span>
                    <i class="fa-solid fa-chevron-right ml-auto text-xs text-[#9ab0c8]"></i>
                </a>

                <!-- IBAN Satırı -->
                <button onclick="copyCardIban()" class="group flex w-full items-center gap-4 py-4 text-left" type="button">
                    <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-[#e8f3ff] text-[#0755a5]">
                        <i class="fa-solid fa-money-check-dollar"></i>
                    </span>
                    <span class="min-w-0 text-left pr-2">
                        <span id="val-bank" class="block text-xs font-medium uppercase tracking-[0.14em] text-[#68809d]"></span>
                        <span id="val-iban" class="mt-1 block break-all text-sm font-semibold tracking-wide text-[#10233d]"></span>
                    </span>
                    <span id="copy-status" class="ml-auto shrink-0 text-xs font-semibold text-[#0755a5] bg-[#e8f3ff] px-2.5 py-1 rounded">Kopyala</span>
                </button>
            </div>

            <!-- Rehbere Ekle Butonu -->
            <button id="btn-vcf" onclick="downloadVCard()" class="hidden mt-6 flex w-full items-center justify-center gap-2 bg-[#0755a5] hover:bg-[#063d78] px-4 py-4 text-sm font-semibold text-white rounded-lg transition-colors">
                <i class="fa-solid fa-user-plus"></i> Rehbere Ekle
            </button>
        </div>

        <footer class="flex items-center justify-center gap-2 border-t border-[#dbe8f5] bg-[#f5faff] px-5 py-4 text-xs font-medium text-[#68809d]">
            <span class="h-2 w-2 rounded-full bg-[#1cc6b6]"></span> Akıllı NFC Kartvizit
        </footer>
    </section>

    <script>
        const FIREBASE_URL = "https://nfc-iban-ac47c-default-rtdb.firebaseio.com";
        let activeData = {};

        window.onload = async function() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('k');

            if (slug) {
                try {
                    const res = await fetch(`${FIREBASE_URL}/kartlar/${slug}.json`);
                    const data = await res.json();
                    document.getElementById('loading').classList.add('hidden');
                    if (data) {
                        activeData = data;
                        renderCard(data);
                    } else {
                        alert("Kart bulunamadı!");
                    }
                } catch (e) {
                    alert("Veritabanı bağlantı hatası!");
                }
            } else {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
            }
        };

        function createSlug(text) {
            const trMap = {'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','Ç':'c','Ğ':'g','İ':'i','Ö':'o','Ş':'s','Ü':'u'};
            let str = text.replace(/[çğıöşüÇĞİÖŞÜ]/g, m => trMap[m]);
            return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + Math.floor(100 + Math.random() * 900);
        }

        async function saveCustomer(e) {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            btn.innerText = "Kaydediliyor...";

            const name = document.getElementById('inp-name').value.trim();
            const bank = document.getElementById('inp-bank').value.trim();
            const iban = document.getElementById('inp-iban').value.trim();
            const phone = document.getElementById('inp-phone').value.trim();

            const slug = createSlug(name);
            const payload = { name, bank, iban, phone };

            try {
                await fetch(`${FIREBASE_URL}/kartlar/${slug}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const baseUrl = window.location.href.split('?')[0];
                const finalUrl = `${baseUrl}?k=${slug}`;
                document.getElementById('generated-url').value = finalUrl;
                document.getElementById('preview-link').href = finalUrl;
                document.getElementById('result-box').classList.remove('hidden');
                btn.innerText = "Kaydet ve Link Üret";
            } catch (err) {
                alert("Kayıt sırasında hata oluştu!");
                btn.innerText = "Kaydet ve Link Üret";
            }
        }

        function renderCard(data) {
            document.getElementById('card-view').classList.remove('hidden');
            document.title = data.name;
            document.getElementById('card-name').innerText = data.name;
            document.getElementById('val-bank').innerText = data.bank;
            document.getElementById('val-iban').innerText = data.iban;

            const initials = data.name.split(' ').map(k => k[0]).join('').substring(0, 2).toUpperCase();
            document.getElementById('card-initials').innerText = initials;

            if (data.phone) {
                const rowPhone = document.getElementById('row-phone');
                rowPhone.href = "tel:" + data.phone.replace(/\s+/g, '');
                rowPhone.classList.remove('hidden');
                document.getElementById('val-phone').innerText = data.phone;
                document.getElementById('btn-vcf').classList.remove('hidden');
            }
        }

        function copyCardIban() {
            navigator.clipboard.writeText(activeData.iban).then(() => {
                const badge = document.getElementById('copy-status');
                badge.innerText = "Kopyalandı ✓";
                setTimeout(() => badge.innerText = "Kopyala", 2000);
            });
        }

        function copyGeneratedUrl() {
            const input = document.getElementById('generated-url');
            navigator.clipboard.writeText(input.value);
            alert("Link kopyalandı! WhatsApp'tan saha ekibine gönderebilirsin.");
        }

        function downloadVCard() {
            const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${activeData.name}\nTEL;TYPE=CELL:${activeData.phone}\nNOTE:${activeData.bank} IBAN: ${activeData.iban}\nEND:VCARD`;
            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${activeData.name}.vcf`;
            link.click();
        }
    </script>
</body>
</html>
